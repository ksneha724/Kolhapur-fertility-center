{% extends "base.html" %}

{% block title %}
Treatments
{% endblock %}

{% block content %}

<section class="page-header">

    <div class="container">

        <h1>
            Fertility Treatments
        </h1>

        <p>
            Explore our fertility care services.
        </p>

    </div>

</section>


<section class="section">

    <div class="container">

        <div class="row g-4">

            {% for service in services %}

            <div class="col-md-6 col-lg-4">

                <div class="service-card h-100">

                    <div class="service-icon">
                        ❤️
                    </div>

                    <h3>
                        {{ service["name"] }}
                    </h3>

                    <p>
                        {{ service["description"] }}
                    </p>

                    <a
                        href="{{ url_for('appointment') }}"
                        class="btn btn-primary"
                    >
                        Book Consultation
                    </a>

                </div>

            </div>

            {% endfor %}

        </div>

    </div>

</section>

{% endblock %}
