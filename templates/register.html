{% extends "base.html" %}

{% block title %}
Patient Registration
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-7 col-lg-6">

                <div class="auth-card">

                    <div class="text-center mb-4">

                        <div class="auth-icon">
                            👤
                        </div>

                        <h2>
                            Create Patient Account
                        </h2>

                        <p class="text-muted">
                            Register to book appointments.
                        </p>

                    </div>


                    <form
                        method="POST"
                        action="{{ url_for('register') }}"
                    >

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name *
                            </label>

                            <input
                                type="text"
                                name="name"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Email *
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Phone
                            </label>

                            <input
                                type="tel"
                                name="phone"
                                class="form-control"
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Password *
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                minlength="6"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Confirm Password *
                            </label>

                            <input
                                type="password"
                                name="confirm_password"
                                class="form-control"
                                minlength="6"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Create Account
                        </button>

                    </form>


                    <p class="text-center mt-4 mb-0">

                        Already have an account?

                        <a href="{{ url_for('login') }}">
                            Login
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
