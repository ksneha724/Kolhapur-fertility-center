{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-md-6 col-lg-5">

                <div class="auth-card">

                    <div class="text-center mb-4">

                        <div class="auth-icon">
                            🔐
                        </div>

                        <h2>
                            Login
                        </h2>

                        <p class="text-muted">
                            Login to your account
                        </p>

                    </div>


                    <form
                        method="POST"
                        action="{{ url_for('login') }}"
                    >

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required
                            >

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter your password"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Login
                        </button>

                    </form>


                    <p class="text-center mt-4 mb-0">

                        Don't have an account?

                        <a href="{{ url_for('register') }}">
                            Register
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
